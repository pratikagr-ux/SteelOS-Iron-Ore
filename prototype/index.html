<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SteelOS Ore — Ganesha Steel prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Instrument+Serif&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* exact tokens pulled from the live SteelOS Trade source (T = { base, surface, line, ink, body, fog, blue, gold, green, red, ... }) */
  --bg:#F4F6F8;--card:#FFFFFF;--line:#D9E0E7;--line2:#EAEEF2;--ink:#0D1218;--ink2:#3A434D;--ink3:#6B7682;
  --accent:#2F6FB0;--accent-ink:#FFFFFF;--accent-soft:#E7F0F8;--accent2:#D9A441;--accent2-bg:#FAF1DC;--dark:#10151A;--dark-ink:#F4F6F8;--dark-ink2:#B7BEC7;--dark-line:#262B33;
  --good:#2F9E6B;--good-bg:#EAFAF1;--warn:#D9A441;--warn-bg:#FAF1DC;--bad:#C0453B;--bad-bg:#FDF1F0;
  --chip:#EAEEF2;--btnline:#D9E0E7;--bar1:#EAEEF2;--bar2:#6B7682;--bar3:#0D1218;--shadow:0 10px 32px rgba(13,18,24,.10),0 2px 8px rgba(13,18,24,.05);
  --serif:'Instrument Serif',Georgia,'Times New Roman',serif;--sans:'Instrument Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1216;--card:#1A1F27;--line:#2A313B;--line2:#232A32;--ink:#EDF1F4;--ink2:#A8B0BB;--ink3:#848D99;
  --accent:#5B9BD9;--accent-ink:#0A1520;--accent-soft:#1E3049;--accent2:#E0C070;--accent2-bg:#3A311C;--dark:#0A0C10;--dark-ink:#EDF1F4;--dark-ink2:#A8B0BB;--dark-line:#242A33;
  --good:#5FBE93;--good-bg:#1A3328;--warn:#E0B563;--warn-bg:#3A2F16;--bad:#D98884;--bad-bg:#3A211E;
  --chip:#232A32;--btnline:#333A45;--bar1:#333A45;--bar2:#8A93A0;--bar3:#EDF1F4;--shadow:0 10px 32px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.35);
}}
:root[data-theme="dark"]{
  --bg:#0F1216;--card:#1A1F27;--line:#2A313B;--line2:#232A32;--ink:#EDF1F4;--ink2:#A8B0BB;--ink3:#848D99;
  --accent:#5B9BD9;--accent-ink:#0A1520;--accent-soft:#1E3049;--accent2:#E0C070;--accent2-bg:#3A311C;--dark:#0A0C10;--dark-ink:#EDF1F4;--dark-ink2:#A8B0BB;--dark-line:#242A33;
  --good:#5FBE93;--good-bg:#1A3328;--warn:#E0B563;--warn-bg:#3A2F16;--bad:#D98884;--bad-bg:#3A211E;
  --chip:#232A32;--btnline:#333A45;--bar1:#333A45;--bar2:#8A93A0;--bar3:#EDF1F4;--shadow:0 10px 32px rgba(0,0,0,.5),0 2px 8px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:22px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:18px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand b{font-size:17px;letter-spacing:-.01em}.brand span{color:var(--accent);font-weight:600;font-size:17px}
.co{padding:0 8px;font-size:13px;color:var(--ink2)}
.nav{display:flex;flex-direction:column;gap:0}
.nav-group{display:flex;flex-direction:column;gap:2px}
.nav-group+.nav-group{margin-top:16px}
.nav-label{font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--ink3);padding:6px 10px 4px}
.nav a{display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:10px;color:var(--ink2);text-decoration:none;font-size:14px;font-weight:500;min-height:40px}
.nav a:hover{background:var(--chip);color:var(--ink)}
.nav a.on{background:var(--card);color:var(--ink);box-shadow:0 0 0 1px var(--line)}
.nav a .ct{margin-left:auto;font-family:var(--mono);font-size:11px;background:var(--accent);color:var(--accent-ink);padding:1px 7px;border-radius:999px}
.nav a svg{flex-shrink:0}
.nav-txt{display:flex;flex-direction:column;gap:1px;min-width:0;flex:1 1 auto}
.nav-t{font-size:14px;font-weight:500;line-height:1.2}
.nav-sub{font-size:11px;font-weight:400;color:var(--ink3);line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav a.on .nav-sub{color:var(--ink2)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;padding:0 4px}
.side-foot label{font-size:12px;color:var(--ink3);padding-left:4px}
select.sel,input.inp,textarea.inp{height:40px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:0 12px;width:100%}
textarea.inp{height:auto;padding:10px 12px;line-height:1.5;resize:vertical}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;gap:16px;padding:18px 32px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid transparent}
.ask{flex:1;max-width:640px;display:flex;align-items:center;gap:10px;height:44px;padding:0 14px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.ask input{flex:1;border:0;outline:none;background:transparent;font-size:14px;min-width:0}
.kbd{font-family:var(--mono);font-size:11px;color:var(--ink3);border:1px solid var(--line);border-radius:8px;padding:2px 6px}
.top-r{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:14px;color:var(--ink2)}
.tag{font-size:12px;font-weight:600;color:var(--warn);background:var(--warn-bg);padding:4px 9px;border-radius:8px}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.view{padding:8px 32px 48px;display:flex;flex-direction:column;gap:22px;max-width:1480px;width:100%}
.h1{font-size:28px;font-weight:600;letter-spacing:-.02em;margin:6px 0 0}
.sub{color:var(--ink2);margin:4px 0 0;font-size:14px;max-width:760px}
.row{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:22px}
.c8{grid-column:span 8}.c4{grid-column:span 4}.c7{grid-column:span 7}.c5{grid-column:span 5}.c6{grid-column:span 6}.c12{grid-column:span 12}.c3{grid-column:span 3}.c9{grid-column:span 9}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px 22px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{margin:0;font-size:16px;font-weight:600}
.chead{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.muted{color:var(--ink2);font-size:13px}.faint{color:var(--ink3);font-size:12px}
.btn{height:40px;padding:0 15px;border-radius:10px;border:1px solid var(--btnline);background:transparent;cursor:pointer;font-size:13px;font-weight:500;white-space:nowrap;display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--chip)}
.btn.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.p:hover{filter:brightness(.94)}
.btn.k{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.s{height:34px;padding:0 12px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap}
.pill.g{color:var(--good);background:var(--good-bg)}.pill.w{color:var(--warn);background:var(--warn-bg)}.pill.b{color:var(--bad);background:var(--bad-bg)}.pill.n{color:var(--ink2);background:var(--chip)}
.dot{width:10px;height:10px;border-radius:999px;display:inline-block;flex:none}
.dot.b{background:var(--bad)}.dot.w{background:var(--warn)}.dot.g{background:var(--good)}
.dec{display:grid;grid-template-columns:12px minmax(0,1fr) 140px auto;gap:16px;align-items:center;padding:15px 0;border-top:1px solid var(--line2)}
.dec .t{font-weight:600;font-size:15px}.dec .x{font-size:13px;color:var(--ink2);line-height:1.45;margin-top:3px}
.amt{text-align:right}.amt .v{font-family:var(--mono);font-size:17px;font-weight:500}.amt .l{font-size:12px;color:var(--ink3)}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.moneycard{background:var(--dark);color:var(--dark-ink);border-radius:14px;padding:20px 22px;display:flex;flex-direction:column;gap:14px;border:1px solid var(--dark-line)}
.moneycard h2{margin:0;font-size:16px}
.moneycard .big{font-family:var(--mono);font-size:34px;font-weight:500;letter-spacing:-.02em}
.mrow{display:flex;justify-content:space-between;gap:12px;padding-top:11px;border-top:1px solid var(--dark-line);color:inherit;text-decoration:none}
.mrow:hover .ml{text-decoration:underline}
.mrow .ml{font-size:14px}.mrow .ms{font-size:12px;color:var(--dark-ink2);margin-top:2px}.mrow .mv{font-family:var(--mono);font-size:15px;white-space:nowrap}
.sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:8px}
.stack{display:flex;height:10px;border-radius:999px;overflow:hidden;gap:2px}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;text-decoration:none;color:inherit}
.kpi:hover{border-color:var(--btnline)}
.kpi .k{font-size:13px;color:var(--ink2)}.kpi .v{font-family:var(--mono);font-size:26px;font-weight:500;letter-spacing:-.01em}
.kpi .d{font-size:12px;color:var(--ink2)}.kpi .d.bad{color:var(--bad)}.kpi .d.warn{color:var(--warn)}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{text-align:left;font-size:12px;font-weight:600;color:var(--ink3);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:12px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--chip)}
.scroll{overflow-x:auto}
.prog{position:relative;height:10px;background:var(--chip);border-radius:999px;overflow:hidden;min-width:120px}
.prog span{position:absolute;left:0;top:0;bottom:0}
.legend{display:flex;gap:14px;font-size:12px;color:var(--ink2);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.bars{display:flex;flex-direction:column;gap:9px}
.barrow{display:grid;grid-template-columns:120px 1fr 70px;gap:10px;align-items:center;font-size:13px}
.barrow .bt{height:8px;border-radius:999px;background:var(--chip);overflow:hidden}.barrow .bt span{display:block;height:100%;border-radius:999px}
.finding{background:var(--bg);border-radius:12px;padding:14px;font-size:13px;line-height:1.5}
.finding b{color:var(--accent);font-size:12px;display:block;margin-bottom:4px}
.munim{background:var(--bg);border:1px solid var(--line);border-left:3px solid var(--accent2);border-radius:12px;padding:14px 16px;font-size:13px;line-height:1.5}
.munim-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.munim-badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.03em;padding:3px 8px 3px 6px;border-radius:999px;flex-shrink:0;border:1px solid currentColor}
.munim-badge svg{fill:currentColor}
.munim-v{font-weight:600;font-size:13.5px}
.munim-label{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);margin:10px 0 6px}
.munim-list{list-style:none;display:flex;flex-direction:column;gap:6px}
.munim-list li{display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--ink2)}
.munim-list .d{width:7px;height:7px;border-radius:50%;margin-top:5px;flex-shrink:0}
.card.mfeed{padding:0;gap:0;overflow:hidden}
.mfeed-head{display:flex;align-items:center;gap:8px;padding:12px 16px;background:var(--dark);color:var(--dark-ink)}
.mfeed-head b{font-size:14px}
.mfeed-head .cap{font-family:var(--mono);font-size:10px;color:var(--dark-ink2);letter-spacing:.05em;text-transform:uppercase}
.mfeed-head .pill{margin-left:auto}
.mfeed-row{display:flex;gap:11px;padding:13px 16px;border-top:1px solid var(--line)}
.mfeed-ic{width:30px;height:30px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.mfeed-ic.b{background:var(--bad-bg);color:var(--bad)}
.mfeed-ic.w{background:var(--warn-bg);color:var(--warn)}
.mfeed-ic.n{background:var(--accent-soft);color:var(--accent)}
.mfeed-t{font-weight:700;font-size:13px;color:var(--ink)}
.mfeed-body{font-size:12.5px;color:var(--ink2);margin-top:4px;line-height:1.45}
/* Live Board — "one desk, one live picture": a clickable grid of pipeline-stage cards
   (sourcing -> purchase -> stock -> dispatch -> buyer -> accounts), each pulsing while live,
   collating down into a real-time KPI strip. Pattern lifted from the SteelOS unit apps' LiveBoard. */
@keyframes liveDot{0%{box-shadow:0 0 0 0 rgba(47,158,107,.5)}70%{box-shadow:0 0 0 6px rgba(47,158,107,0)}100%{box-shadow:0 0 0 0 rgba(47,158,107,0)}}
.board-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.board-card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:8px}
.board-card:hover{border-color:var(--btnline)}
.board-card .bc-head{display:flex;align-items:center;gap:8px}
.board-card .bc-ic{width:30px;height:30px;border-radius:8px;background:var(--chip);color:var(--ink2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.board-card .bc-dept{font-weight:700;font-size:13.5px}
.board-card .bc-live{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--good);animation:liveDot 2s infinite}
.board-card .bc-who{font-size:11.5px;color:var(--ink3);font-family:var(--mono)}
.board-card .bc-enters{font-size:12px;color:var(--ink2);line-height:1.4}
.board-card .bc-stat{font-family:var(--mono);font-size:17px;font-weight:600;letter-spacing:-.01em}
.board-card .bc-sub{font-size:11.5px;color:var(--ink2)}
.board-card .bc-updated{font-size:10.5px;color:var(--ink3)}
.board-arrow{text-align:center;font-size:12px;color:var(--ink3);font-family:var(--mono);letter-spacing:.05em;padding:2px 0}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:3px;text-decoration:none;color:inherit}
.tile:hover{border-color:var(--btnline)}
.tile .s{font-size:12px;font-weight:600}.tile .n{font-size:14px;font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:none;padding:10px 14px;font-size:14px;font-weight:500;color:var(--ink2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.stat{display:flex;flex-direction:column;gap:2px}.stat .k{font-size:12px;color:var(--ink3)}.stat .v{font-family:var(--mono);font-size:18px}
.stats{display:flex;gap:28px;flex-wrap:wrap}
.mtiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:12px;margin:0 0 20px}
.mtile{background:var(--card);border:1px solid var(--line);border-top:3px solid var(--accent2);border-radius:10px;padding:13px 15px;display:flex;flex-direction:column;gap:4px}
.mtile .k{font-size:11px;letter-spacing:.04em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.mtile .v{font-family:var(--mono);font-size:21px;font-weight:600;letter-spacing:-.01em}
.mtile .s{font-size:12px;color:var(--ink3)}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.fld{display:flex;flex-direction:column;gap:5px}.fld label{font-size:12px;color:var(--ink2);font-weight:500}
.fld .hint{font-size:11px;color:var(--ink3)}
.total{display:flex;justify-content:space-between;align-items:baseline;padding-top:12px;border-top:1px solid var(--line)}
.total .v{font-family:var(--mono);font-size:22px;font-weight:500}
.ok-banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:10px;background:var(--good-bg);color:var(--good);font-size:13px;font-weight:600}
.warn-banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:10px;background:var(--warn-bg);color:var(--warn);font-size:13px;font-weight:600}
.bad-banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:10px;background:var(--bad-bg);color:var(--bad);font-size:13px;font-weight:600}
.timeline{display:flex;flex-direction:column;gap:0}
.tl{display:grid;grid-template-columns:22px 1fr;gap:12px;padding-bottom:16px;position:relative}
.tl:before{content:"";position:absolute;left:10px;top:20px;bottom:0;width:2px;background:var(--line)}
.tl:last-child:before{display:none}
.tl .o{width:22px;height:22px;border-radius:999px;border:2px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center}
.tl.done .o{background:var(--good);border-color:var(--good)}
.tl.now .o{border-color:var(--accent2)}
.tl .tt{font-weight:600;font-size:14px}.tl .td{font-size:13px;color:var(--ink2)}
.docthumb{width:88px;height:64px;border-radius:8px;background:repeating-linear-gradient(0deg,var(--chip),var(--chip) 6px,var(--card) 6px,var(--card) 9px);border:1px solid var(--line);display:flex;align-items:flex-end;padding:4px;font-size:10px;color:var(--ink3)}
.masked{color:var(--ink3);font-size:12px;font-family:var(--sans);font-style:italic}
.chat{display:flex;flex-direction:column;gap:14px}
.msg{max-width:760px;padding:14px 16px;border-radius:12px;line-height:1.5;font-size:14px}
.msg.u{align-self:flex-end;background:var(--ink);color:var(--bg)}
.msg.a{align-self:flex-start;background:var(--card);border:1px solid var(--line)}
.msg .src{margin-top:10px;display:flex;gap:6px;flex-wrap:wrap}
.msg .src a{font-size:12px;background:var(--chip);padding:3px 8px;border-radius:8px;text-decoration:none;color:var(--ink2)}
/* phone */
.phonewrap{display:flex;gap:36px;align-items:flex-start;flex-wrap:wrap}
.phone{width:390px;height:800px;border-radius:40px;background:var(--dark);padding:12px;box-shadow:var(--shadow);flex:none}
.screen{width:100%;height:100%;border-radius:30px;background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
.pscroll{flex:1;overflow-y:auto;padding:22px 16px 16px;display:flex;flex-direction:column;gap:14px}
.pbar{height:66px;border-top:1px solid var(--line);background:var(--card);display:grid;grid-template-columns:repeat(4,1fr);align-items:center;font-size:11px;color:var(--ink2);text-align:center}
.pbar div{display:flex;flex-direction:column;align-items:center;gap:3px}
.pbar .on{color:var(--ink);font-weight:600}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.pbtn{height:48px;border-radius:12px;border:1px solid var(--btnline);background:transparent;font-weight:600;font-size:14px;cursor:pointer;width:100%}
.pbtn.p{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pbtn.k{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.shot{height:150px;border-radius:12px;border:1.5px dashed var(--btnline);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--ink2);font-size:13px;cursor:pointer;background:transparent;width:100%}
.scan{height:150px;border-radius:12px;background:var(--dark);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;color:var(--dark-ink2);font-size:13px}
.scan:after{content:"";position:absolute;left:0;right:0;height:2px;background:var(--accent);animation:sc 1s linear infinite;top:0}
@keyframes sc{from{top:0}to{top:100%}}
.xf{display:grid;grid-template-columns:1fr auto;gap:4px 10px;font-size:13px;align-items:center}
.xf .conf{font-family:var(--mono);font-size:11px;color:var(--good)}
.xf .conf.lo{color:var(--warn)}
.steps{display:flex;gap:6px}.steps i{flex:1;height:4px;border-radius:8px;background:var(--line)}.steps i.on{background:var(--accent)}
.persona{display:flex;flex-direction:column;gap:12px;max-width:420px}
.persona h2{margin:0;font-size:22px;letter-spacing:-.01em}
.wa{background:#0B141A;color:#E9EDEF}.wa .pscroll{background:#0B141A}
.wa .bub{background:#1F2C33;border-radius:10px;padding:10px 12px;font-size:13px;line-height:1.45;max-width:88%}
.wa .bub.me{background:#005C4B;align-self:flex-end}
.wa .wbtn{height:44px;border-radius:10px;border:0;background:#1F2C33;color:#53BDEB;font-weight:600;cursor:pointer;width:100%}
/* overlay */
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;font-size:14px;box-shadow:var(--shadow);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:90vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.ovl{position:fixed;inset:0;background:rgba(10,11,13,.45);display:flex;align-items:center;justify-content:center;z-index:40;padding:20px}
.modal{background:var(--card);border-radius:16px;max-width:640px;width:100%;max-height:88vh;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--shadow)}
.modal h3{margin:0;font-size:19px}
.mnav{display:none}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}.c8,.c4,.c7,.c5,.c6,.c3,.c9{grid-column:span 12}.dec{grid-template-columns:12px 1fr;}.dec .amt{text-align:left;grid-column:2}.dec .acts{grid-column:2;justify-content:flex-start}}
@media (max-width:860px){
  .shell{grid-template-columns:1fr}.side{display:none}
  .top{padding:12px 16px;flex-wrap:wrap}.top-r .hide-s{display:none}.ask{order:3;max-width:none;flex-basis:100%}
  .view{padding:8px 16px 96px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .mnav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);overflow-x:auto;z-index:20;padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
  .mnav a{flex:none;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--ink2);text-decoration:none;padding:6px 12px;min-width:64px;min-height:44px;justify-content:center}
  .mnav a.on{color:var(--ink);font-weight:600}
  .form{grid-template-columns:1fr}.phone{width:100%;max-width:390px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.kcol{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:120px}
.kcol-h{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:600;color:var(--ink2);padding:2px 2px 8px;border-bottom:1px solid var(--line2)}
.kcol-b{display:flex;flex-direction:column;gap:8px}
.kcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 12px;cursor:pointer;display:flex;flex-direction:column;gap:6px}
.kcard:hover{border-color:var(--btnline)}
.kcard .kv{font-weight:600;font-size:13px}
.kcard .kr{font-size:12px;color:var(--ink2)}
.kcard .kf{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:2px}

<body>
<div id="app"></div>

<script>
(function(){
"use strict";
/* ---------- helpers ---------- */
const FX = 84.2;
const TODAY = new Date(2026, 8, 18);
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r4 = n => Math.round(n * 1e4) / 1e4;
const fx = n => String(+(+n).toFixed(4));
const num = (n, d) => Number(n).toLocaleString("en-IN", {maximumFractionDigits: d == null ? 2 : d});
const inr = n => (n < 0 ? "−" : "") + "₹" + Math.round(Math.abs(n)).toLocaleString("en-IN");
const inr2 = n => "₹" + Number(n).toLocaleString("en-IN", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const short = n => { const a = Math.abs(n), s = n < 0 ? "−" : ""; if (a >= 1e7) return s + "₹" + (a / 1e7).toFixed(2) + " Cr"; if (a >= 1e5) return s + "₹" + (a / 1e5).toFixed(2) + " L"; return s + inr(a); };
const usd = n => "$" + (n >= 1e6 ? (n / 1e6).toFixed(2) + " M" : Math.round(n).toLocaleString("en-IN"));
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const D = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const fdate = s => { const d = typeof s === "string" ? D(s) : s; return d.getDate() + " " + MON[d.getMonth()] + " " + d.getFullYear(); };
const days = s => Math.round((D(s) - TODAY) / 864e5);
const addMonths = (s, m) => { const d = D(s); d.setMonth(d.getMonth() + m); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };

/* ---------- icons ---------- */
const P = {
  dashboard: '<rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/>',

  check: '<path d="M5 12l5 5L20 7"/>',

  moon: '<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
  pin: '<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  mic: '<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>',
  home: '<path d="M4 11l8-7 8 7v9H4z"/>',
  bell: '<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/>',
  pipeline: '<path d="M3 4h18l-7 9v6l-4 2v-8z"/>',
  board: '<circle cx="5" cy="5" r="2.3"/><circle cx="19" cy="5" r="2.3"/><circle cx="12" cy="12" r="2.3"/><circle cx="5" cy="19" r="2.3"/><circle cx="19" cy="19" r="2.3"/><path d="M6.8 6.4L10.2 10.4M17.2 6.4L13.8 10.4M10.2 13.6L6.8 17.6M13.8 13.6L17.2 17.6"/>'
};
const ic = (n, s) => '<svg width="' + (s || 18) + '" height="' + (s || 18) + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (P[n] || "") + "</svg>";

/* ---------- roles ---------- */
const ROLES = {
  owner:    {name: "Owner", money: true, nav: ["dashboard","board","pipeline","purchase","sale","position","auctions","trips","transit","export","party","money","ask"], persona: "owner"},
  desk:     {name: "Trading desk", money: true, nav: ["dashboard","board","pipeline","purchase","sale","position","auctions","trips","transit","export","party","ask","field"], persona: "owner"},
  mine:     {name: "Mine supervisor", money: false, nav: ["field","trips","transit"], persona: "mine"},
  plant:    {name: "Plant representative", money: false, nav: ["field","trips","transit"], persona: "plant"},
  port:     {name: "Port coordinator", money: false, nav: ["export","field","transit"], persona: "driver"},
  accounts: {name: "Accounts", money: true, nav: ["dashboard","board","money","purchase","sale","position","party"], persona: "owner"},
  ca:       {name: "CA (external)", money: false, nav: ["compliance"], persona: "owner"}
};
const NAV = {dashboard:"Dashboard", board:"Live Board", pipeline:"Sales pipeline", purchase:"Purchase orders", sale:"Sale orders", position:"Position", auctions:"Auctions", trips:"Delivery register", transit:"Transit", settle:"Settlements", export:"Export desk", party:"Parties", money:"Money", compliance:"Compliance", ask:"Ask SteelOS", data:"Import & Tally", field:"Field app"};
/* one-line descriptive subtitle shown under each nav label, sidebar-family styling (icon + bold label + muted subtitle) */
const NAV_SUB = {dashboard:"Today's priorities", board:"One desk, one live picture", pipeline:"Enquiries → quotes → orders", purchase:"Buy-side sauda & lifting", sale:"Sell-side sauda & lifting", position:"Open risk, true P/L", auctions:"Live mine auctions", trips:"Loads on the road", transit:"Where every truck is", settle:"Close & reconcile sauda", export:"Container & vessel desk", party:"Every counterparty, one view", money:"Cash, credit, cost of capital", compliance:"GST, e-way, filings", ask:"Ask Munim anything", data:"Tally sync & imports", field:"Weighbridge & yard capture"};
/* nav grouping — same routes as before, just clustered into labelled sections in the sidebar so a role
   with a long nav (owner/desk) reads as a map of the business rather than a flat list. */
const NAV_GROUPS = [
  ["Overview", ["dashboard", "board"]],
  ["Trade", ["pipeline", "purchase", "sale", "position", "auctions"]],
  ["Logistics", ["trips", "transit", "export"]],
  ["Ledgers", ["party", "money"]],
  ["More", ["ask", "field", "compliance", "data", "settle"]]
];
function groupedNavHtml(R, allowed, decCount) {
  const seen = new Set();
  const link = n => '<a href="#/' + n + '" class="' + (n === allowed ? "on" : "") + '">' + ic(n) + '<span class="nav-txt"><span class="nav-t">' + NAV[n] + '</span><span class="nav-sub">' + (NAV_SUB[n] || "") + "</span></span>" + (n === "dashboard" && decCount ? '<span class="ct">' + decCount + "</span>" : "") + "</a>";
  const groups = NAV_GROUPS.map(([label, keys]) => {
    const items = keys.filter(k => R.nav.includes(k) && !seen.has(k));
    items.forEach(k => seen.add(k));
    return items.length ? '<div class="nav-group"><div class="nav-label">' + label + "</div>" + items.map(link).join("") + "</div>" : "";
  }).join("");
  const rest = R.nav.filter(k => !seen.has(k));
  return groups + (rest.length ? '<div class="nav-group">' + rest.map(link).join("") + "</div>" : "");
}
const canMoney = () => ROLES[S.role].money;
const M = v => canMoney() ? v : '<span class="masked">hidden for role</span>';

/* ---------- master data ---------- */
const PARTY = {
  M1: {name: "Barbil Minerals", type: "Mine", place: "Barbil", lease: "2031-03-31", ec: "2029-06-30", gst: "Filing current"},
  M2: {name: "Mahanadi Mines", type: "Mine", place: "Joda", lease: "2034-01-15", ec: "2030-02-28", gst: "Filing current"},
  M3: {name: "Keonjhar Ores", type: "Mine", place: "Koira", lease: "2028-11-30", ec: "2027-05-31", gst: "August return pending"},
  P1: {name: "Kalinga DRI", type: "DRI plant", place: "Jajpur"},
  P2: {name: "Utkal Pellets", type: "Pellet plant", place: "Barbil"},
  P3: {name: "Shree Sponge", type: "DRI plant", place: "Rourkela"},
  P4: {name: "Odisha Metaliks", type: "DRI plant", place: "Cuttack"},
  T1: {name: "Maa Tarini Roadways", type: "Transporter"},
  T2: {name: "Barbil Carriers", type: "Transporter"},
  T3: {name: "Jajpur Logistics", type: "Transporter"},
  T4: {name: "Sundargarh Carriers", type: "Transporter"},
  B1: {name: "Pacific Ore Trading Pte Ltd", type: "Export buyer", place: "Singapore"},
  B2: {name: "Hebei Ore Import Co", type: "Export buyer", place: "Hebei, China"},
  M4: {name: "Sundargarh Mining Co", type: "Mine", place: "Sundargarh", lease: "2029-08-31", ec: "2028-01-31", gst: "Filing current"},
  P5: {name: "Rungta Sons DRI", type: "DRI plant", place: "Rourkela"},
  P6: {name: "Neelachal Pellets", type: "Pellet plant", place: "Kalinganagar"}
};
const pn = id => PARTY[id] ? PARTY[id].name : id;

/* internal team — the people keying data in; every role has one primary person here for the demo, and every order/trip/comment
   records which of them touched it (item 8: attribution + internal comment threads) */
const TEAM = {
  u1: {name: "Rohan Podder", role: "owner", initials: "RP"},
  u2: {name: "Ananya Singh", role: "desk", initials: "AS"},
  u3: {name: "Biswajit Nayak", role: "mine", initials: "BN"},
  u4: {name: "Priya Das", role: "plant", initials: "PD"},
  u5: {name: "Sourav Patra", role: "accounts", initials: "SP"},
  u6: {name: "Manoj Rana", role: "port", initials: "MR"}
};
const roleUser = role => Object.keys(TEAM).find(k => TEAM[k].role === role) || "u1";
/* seed records predate per-record attribution — hash the id so the UI always has someone consistent to show, without touching every row */
function attributedTo(key) {
  let h = 0; for (let i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) >>> 0;
  const keys = Object.keys(TEAM);
  return keys[h % keys.length];
}
const whoFor = (rec, field) => TEAM[rec[field]] || TEAM[attributedTo(rec.id + field)];
function byLine(rec, field, label) {
  const u = whoFor(rec, field);
  return '<span class="faint">' + label + " " + u.name + (rec[field + "At"] ? " · " + rec[field + "At"] : "") + "</span>";
}
/* comment threads — attached to any scope id (a decision, a blocker, an order, a trip) */
const commentsFor = id => S.comments[id] || (S.comments[id] = []);
function commentThread(scopeId) {
  const list = commentsFor(scopeId);
  const items = list.map(c => { const u = TEAM[c.by] || TEAM.u2; return '<div style="display:flex;gap:8px;align-items:flex-start;padding:6px 0"><span class="pill n" style="flex:none">' + u.initials + '</span><div><div style="font-size:13px"><b>' + u.name + '</b> <span class="faint">' + c.at + '</span></div><div style="font-size:13px;color:var(--ink2)">' + c.text + "</div></div></div>"; }).join("");
  return '<details><summary style="cursor:pointer;font-size:13px;color:var(--ink2)">' + ic("ask", 13) + " " + list.length + (list.length === 1 ? " comment" : " comments") + "</summary>" +
    '<div style="margin-top:6px">' + (items || '<p class="muted" style="font-size:13px">No comments yet — start the thread.</p>') + "</div>" +
    '<div style="display:flex;gap:8px;margin-top:8px"><input class="inp" style="flex:1" type="text" placeholder="Note for the team…" id="cmt-' + scopeId + '"><button class="btn" data-act="addcomment" data-scope="' + scopeId + '">Post</button></div></details>';
}

const SCHED = {
  CLO: {name: "CLO lump — PSU tender terms", note: "Modelled on MMTC’s 2015 Barbil tender for crushed sized ore (63% Fe basis).", lines: [
    {k: "fe", label: "Fe", dir: "min", basis: 63, bands: [{from: 63, to: 62, rate: 2}, {from: 62, to: 61, rate: 4}], reject: 61, text: "63→62: 2% of base per 1% Fe, 62→61: 4% per 1%, pro-rata. Below 61% rejected at Re 1/t."},
    {k: "sio2", label: "SiO₂", dir: "max", basis: 3.5, type: "step", rate: 2.3, step: 0.1, text: "₹2.30/t for each 0.1% above 3.5%"},
    {k: "al2o3", label: "Al₂O₃", dir: "max", basis: 2.5, type: "step", rate: 2.3, step: 0.1, text: "₹2.30/t for each 0.1% above 2.5%"},
    {k: "s", label: "S", dir: "max", basis: 0.02, type: "step", rate: 5, step: 0.01, text: "₹5/t for each 0.01% above 0.02%"},
    {k: "p", label: "P", dir: "max", basis: 0.05, type: "step", rate: 5, step: 0.01, text: "₹5/t for each 0.01% above 0.05%"},
    {k: "moist", label: "Moisture", dir: "max", basis: 3.5, type: "qty", text: "Quantity deducted at actual above 3.5%"},
    {k: "over", label: "Oversize +40 mm", dir: "max", basis: 10, type: "excess", rate: 23, text: "₹23/t on quantity beyond 10%"},
    {k: "under", label: "Undersize −10 mm", dir: "max", basis: 10, type: "excess", rate: 30, text: "₹30/t on quantity beyond 10%"}
  ]},
  FINES: {name: "Fines — pellet plant terms", note: "Simpler private-plant terms: Fe, silica, alumina, moisture.", lines: [
    {k: "fe", label: "Fe", dir: "min", basis: 62, bands: [{from: 62, to: 60, rate: 2}], reject: 60, text: "2% of base per 1% below 62%, pro-rata. Below 60% rejected."},
    {k: "sio2", label: "SiO₂", dir: "max", basis: 4, type: "step", rate: 2, step: 0.1, text: "₹2/t per 0.1% above 4%"},
    {k: "al2o3", label: "Al₂O₃", dir: "max", basis: 3, type: "step", rate: 2, step: 0.1, text: "₹2/t per 0.1% above 3%"},
    {k: "moist", label: "Moisture", dir: "max", basis: 8, type: "qty", text: "Quantity deducted at actual above 8%"}
  ]}
};

/* ---------- settlement engine ---------- */
function settle(key, a, qty, rate) {
  const sch = SCHED[key]; const lines = []; let ded = 0, rejected = false, payQty = qty;
  qty = +qty || 0; rate = +rate || 0;
  sch.lines.forEach(L => {
    const raw = a[L.k]; if (raw === undefined || raw === null || raw === "") return;
    const x = +raw; let rs = 0, work = "Within limit";
    if (L.bands) {
      if (L.reject != null && x < L.reject) { rejected = true; work = "Below rejection limit of " + L.reject + "%"; }
      else if (x < L.basis) {
        let pct = 0; const parts = [];
        L.bands.forEach(b => { const cov = r4(Math.max(0, b.from - Math.max(x, b.to))); if (cov > 0) { pct += cov * b.rate; parts.push(fx(cov) + "% × " + b.rate + "%"); } });
        pct = r4(pct); const perT = rate * pct / 100; rs = perT * qty;
        work = parts.join(" + ") + " = " + fx(pct) + "% of base = " + inr2(perT) + "/t × " + num(qty) + " t";
      }
    } else if (L.type === "step") {
      if (x > L.basis) { const st = r4((x - L.basis) / L.step); const perT = r4(st * L.rate); rs = perT * qty; work = fx(r4(x - L.basis)) + "% over = " + fx(st) + " × ₹" + L.rate + " = " + inr2(perT) + "/t × " + num(qty) + " t"; }
    } else if (L.type === "qty") {
      if (x > L.basis) { const ex = r4(x - L.basis); const q = r4(qty * ex / 100); payQty = r4(qty - q); rs = q * rate; work = fx(ex) + "% × " + num(qty) + " t = " + num(q) + " t × " + inr(rate); }
    } else if (L.type === "excess") {
      if (x > L.basis) { const ex = r4(x - L.basis); const q = r4(qty * ex / 100); rs = q * L.rate; work = fx(ex) + "% excess × " + num(qty) + " t = " + num(q) + " t × ₹" + L.rate; }
    }
    rs = Math.round(rs); ded += rs;
    lines.push({k: L.k, label: L.label, actual: x, limit: (L.dir === "min" ? "min " : "max ") + L.basis + "%", work, rs});
  });
  const gross = Math.round(qty * rate);
  if (rejected) { const net = Math.round(qty * 1); return {rejected: true, lines, gross, ded: gross - net, net, payQty: qty}; }
  return {rejected: false, lines, gross, ded, net: gross - ded, payQty};
}

  const reqAvg = balQty ? (L.basis * s.qty - dFeSum) / balQty : null;
  return {basis: L.basis, dQty, avgFe, balQty, reqAvg, gap: reqAvg != null ? reqAvg - L.basis : 0};
}
const nextOrderId = kind => { const pre = kind === "purchase" ? "P" : "S"; const nums = S.saudas.filter(x => x.kind === kind).map(x => +x.id.slice(2)).filter(n => !isNaN(n)); return pre + "-" + (Math.max(2000, ...nums) + 1); };
const estMargin = s => s.rate - s.est.purchase - s.est.freight - s.est.ded - s.est.fin;
/* per-delivery booked P&L — one truck's worth of the sale order's margin, using the actual matched purchase rate and the
   actual assay deduction where the plant has reported one, plus the same per-tonne finance cost already priced into est.fin */
function perDeliveryPL(t) {
  const s = so(t.sauda);
  if (!s || !s.est) return null;
  const m = orderMatches(s)[0];
  const buy = m && po(m.id);
  if (!buy) return null;
  const qty = t.plantNet || t.mineNet;
  const ded = t.a ? settle(s.sched, t.a, qty, s.rate).ded : qty * s.est.ded;
  const revenue = qty * s.rate, cost = qty * buy.rate, freight = qty * s.est.freight, interest = qty * s.est.fin;
  const pl = revenue - cost - freight - ded - interest;
  return {qty, buyRate: buy.rate, revenue, cost, freight, ded, interest, pl, perT: pl / qty};
}
const shortPct = t => t.plantNet ? r4((t.mineNet - t.plantNet) / t.mineNet * 100) : null;
const tripFlag = t => {

  if (t.status === "in_transit" && t.hrs > 8) return {k: "Delayed", c: "w", why: "In transit " + Math.floor(t.hrs) + " h " + Math.round((t.hrs % 1) * 60) + " m"};
  const sp = shortPct(t); if (sp != null && sp > 0.75) return {k: "Shortage", c: "b", why: "Short " + fx(r4(sp).toFixed(1)) + "% at plant"};
  const s = sauda(t.sauda); if (t.a && s && s.sched) { const L = SCHED[s.sched].lines[0]; if (t.a.fe < L.reject + 0.5) return {k: t.a.fe < L.reject ? "Rejected" : "Rejection risk", c: "b", why: "Fe " + t.a.fe + "% · limit " + L.reject + "%"}; }

};

/* ---------- position (PRD §6.2 "Position view" — bought-unsold / sold-unsourced tonnes, item 6) ----------
   Pooled by category (type + size for CLO, just "Fines" for fines — Fe% within a category is a settlement
   variable, not a separate bucket) rather than by mine/exact item, since that's how a buyer or a plant bid
   actually thinks about fungible tonnage. Within a category, open buys/sells are matched oldest-first (FIFO)
   regardless of which specific orders were manually linked in the Purchase/Sale modules — this view answers
   "what's my real net exposure and how long has the oldest bit of it been open", not "who is it earmarked for". */
const posCategory = it => !it ? "Unclassified" : it.type === "Fines" ? "Fines" : "CLO " + it.size;
const posCategories = () => Array.from(new Set(S.items.map(posCategory)));
function fifoPool(cat) {
  const mk = s => ({id: s.id, qty: s.qty, date: s.bookedAt || s.from || "2026-09-18", rate: s.rate, party: s.party});
  const buys = POs().filter(p => p.status !== "Awaiting approval" && posCategory(item(p.item)) === cat).map(mk).sort((a, b) => D(a.date) - D(b.date));
  const sells = SOs().filter(s => posCategory(item(s.item)) === cat).map(mk).sort((a, b) => D(a.date) - D(b.date));
  let bi = 0, si = 0, bRem = buys[0] ? buys[0].qty : 0, sRem = sells[0] ? sells[0].qty : 0;
  while (bi < buys.length && si < sells.length) {
    const q = Math.min(bRem, sRem); bRem -= q; sRem -= q;
    if (bRem <= 0) { bi++; bRem = buys[bi] ? buys[bi].qty : 0; }
    if (sRem <= 0) { si++; sRem = sells[si] ? sells[si].qty : 0; }
  }
  const openBuys = bi < buys.length ? [Object.assign({}, buys[bi], {qty: bRem})].concat(buys.slice(bi + 1)) : [];
  const openSells = si < sells.length ? [Object.assign({}, sells[si], {qty: sRem})].concat(sells.slice(si + 1)) : [];
  const bought = buys.reduce((a, b) => a + b.qty, 0), sold = sells.reduce((a, b) => a + b.qty, 0);
  return {cat, buys, sells, openBuys, openSells, bought, sold, net: bought - sold};
}
const positionBook = () => posCategories().map(fifoPool).filter(p => p.bought || p.sold);

/* P&L view of the same book: FIFO cost, break-even (FIFO + average landed-cost overhead from matched sale orders),
   booked P/L (agreed-rate margin on every manually matched buy↔sell pair) and billed P/L (the dispatched slice of
   that), plus a desk-editable mark-to-market rate for unrealised P/L on the still-open balance. */
function positionRow(cat) {
  const p = fifoPool(cat);
  const wavg = lots => { const q = lots.reduce((a, l) => a + l.qty, 0); return q ? lots.reduce((a, l) => a + l.qty * l.rate, 0) / q : null; };
  const fifoRate = wavg(p.openBuys.length ? p.openBuys : p.buys);
  const costedSO = SOs().filter(s => posCategory(item(s.item)) === cat && s.est);
  const overhead = costedSO.length ? costedSO.reduce((a, s) => a + s.est.freight + s.est.ded + s.est.fin, 0) / costedSO.length : 0;
  const breakEven = fifoRate != null ? fifoRate + overhead : null;
  let booked = 0, billed = 0;
  SOs().filter(s => posCategory(item(s.item)) === cat).forEach(s => {
    orderMatches(s).forEach(m => {
      const buy = S.saudas.find(x => x.id === m.id && x.kind === "purchase");
      if (!buy) return;
      /* true P/L, not gross trading margin — nets the same freight, deduction & finance cost
         already priced into est.fin elsewhere (Sale detail's Margin build-up, per-delivery P&L) */
      const overheadPerT = s.est ? (s.est.freight + s.est.ded + s.est.fin) : 0;
      const pl = (s.rate - buy.rate - overheadPerT) * m.qty;
      booked += pl;
      billed += pl * ((s.disp || 0) / 100);
    });
  });
  const mtm = S.mtm[cat] || (S.mtm[cat] = {today: Math.round(fifoRate || 0), yesterday: Math.round(fifoRate || 0)});
  const todaysPL = fifoRate != null ? (mtm.today - breakEven) * p.net : null;
  const deltaPL = (mtm.today - mtm.yesterday) * p.net;
  return Object.assign({}, p, {fifoRate, breakEven, booked, billed, mtm, todaysPL, deltaPL});
}
const positionRows = () => posCategories().map(positionRow).filter(r => r.bought || r.sold);

function liftingTable(trips, order) {
  const rakeOn = order && S.rake.sauda && (order.id === S.rake.sauda || orderMatches(order).some(m => m.id === S.rake.sauda));
  if (!trips.length && !rakeOn) return '<p class="muted">No lifting recorded yet.</p>';
  const rows = trips.map(t => {
    const s = sauda(t.sauda), sp = shortPct(t), f = tripFlag(t);
    const res = t.a ? settle(s.sched, t.a, t.plantNet || t.mineNet, s.rate) : null;
    const inv = S.invoices.find(i => i.trip === t.id);
    return '<tr class="click" data-go="#/trip/' + t.id + '"><td class="mono">' + t.loaded + '</td><td class="mono">' + t.veh + '</td><td class="r mono">' + num(t.mineNet) + ' t</td><td>' + pn(t.plant) + (t.rerouted ? '<div class="faint">Rerouted → ' + pn(t.rerouted.to) + '</div>' : "") + '</td><td>' + (t.plantNet ? num(t.plantNet) + " t" : '<span class="faint">pending</span>') + '</td><td>' + (t.a ? Object.keys(t.a).map(k => k + " " + t.a[k] + "%").join(", ") : '<span class="faint">pending</span>') + '</td><td class="r mono" style="color:' + (sp > 0.75 ? "var(--bad)" : "inherit") + '">' + (sp != null ? sp.toFixed(2) + "%" : "—") + '</td><td>' + (res && res.rejected ? '<span class="pill b">Rejected</span>' : f ? '<span class="pill ' + f.c + '">' + f.k + "</span>" : res ? '<span class="pill g">Settled</span>' : '<span class="pill n">Pending</span>') + '</td><td>' + (inv ? '<span class="pill n">' + inv.id + "</span>" : '<span class="faint">—</span>') + "</td></tr>";
  }).join("");
  const rakeRow = rakeOn ? (() => {
    const r = S.rake, rs = sauda(r.sauda);
    return '<tr><td class="mono">Rake · ' + r.id + '</td><td class="mono">' + r.rr + '</td><td class="r mono">' + num(r.qty) + ' t</td><td>' + pn(rs.party) + '</td><td>' + num(r.qty) + ' t</td><td>' + Object.keys(r.plantA).map(k => k + " " + r.plantA[k] + "%").join(", ") + '</td><td class="r mono">' + fx(r4(r.load.fe - r.plantA.fe)) + '% Fe</td><td>' + (r.dispute === "accepted" ? '<span class="pill g">Settled</span>' : '<span class="pill w">Disputed</span>') + '</td><td class="faint">DN ' + r.dn.no + "</td></tr>";
  })() : "";

}
function attachControl(rec) {
  const other = rec.kind === "purchase" ? "sale" : "purchase";
  const opp = rec.kind === "purchase" ? SOs() : POs();
  const links = orderMatches(rec).map(m => {
    const o = sauda(m.id);
    return '<div class="xf" style="justify-content:space-between;align-items:center"><a href="#/' + other + "/" + m.id + '">' + m.id + (o ? " · " + pn(o.party) : "") + '</a><span style="display:flex;gap:8px;align-items:center"><span class="mono faint">' + num(m.qty, 0) + ' t</span><button class="btn s" data-act="unlink" data-id="' + rec.id + '" data-o="' + m.id + '">Unlink</button></span></div>';
  }).join("");

    return '<section class="card"><div class="chead"><h2>' + r.cat + '</h2>' + badge + "</div>" +
      munimPanel(verdict, sev, weighed) +
      '<div class="row" style="margin-top:14px"><section class="card c6" style="box-shadow:none;padding:0"><h2>Pending purchases <span class="faint">· cheapest first</span></h2>' + po.buysHtml + '</section>' +
      '<section class="card c6" style="box-shadow:none;padding:0"><h2>Pending sales <span class="faint">· best rate first</span></h2>' + po.sellsHtml + "</section></div></section>";
  }).join("");
  return head("Position", "Every open item's purchase vs sale balance — FIFO-costed, marked to today's rate. P/L here is true P/L, net of freight, deduction and finance cost, not the gross rate spread. The manual links in Purchase/Sale orders don't change the balance; it's your real net risk.") +
    mtiles([
      { k: "Bought, not yet sold", v: num(long, 0) + " t", color: "var(--warn)", vcolor: "var(--warn)" },
      { k: "Sold, not yet sourced", v: num(short_, 0) + " t", color: "var(--bad)", vcolor: "var(--bad)" },
      { k: "True booked P/L", v: M(inr(totalBooked)), s: "net of freight, deduction & finance", color: plColor(totalBooked), vcolor: plColor(totalBooked) },
      { k: "Today's unrealised P/L", v: M(inr(totalMtm)), color: plColor(totalMtm), vcolor: plColor(totalMtm) }
    ]) +
    positionTable(rows) +
    '<h2 style="margin:24px 4px 4px">Pending orders</h2><p class="faint" style="margin:0 4px 12px">Purchase and sale orders still to be lifted — including ones already matched to a counterparty but with lifting not yet started or in progress.</p>' +
    (pending || '<p class="muted">Everything is fully lifted — no pending purchases or sales.</p>');
}

/* ---------- parties — every mine, plant, buyer and transporter, with their orders/trips, ledger and business-to-date (item 4) ---------- */
const PARTY_TYPES = [["Mine", "Mines"], ["DRI plant", "DRI plants"], ["Pellet plant", "Pellet plants"], ["Transporter", "Transporters"], ["Export buyer", "Export buyers"]];
const partyOrders = pid => S.saudas.filter(s => s.party === pid);
function partyTrips(pid) {
  const p = PARTY[pid];
  if (!p) return [];
  if (p.type === "Transporter") return S.trips.filter(t => t.tr === pid);
  if (p.type === "Mine") return S.trips.filter(t => t.mine === pid);
  return S.trips.filter(t => t.plant === pid);
}
const isClosedOrder = o => o.status === "Completed" || o.status === "Cancelled" || (o.kind === "sale" && o.setl >= 100);
function partyOrderRow(o) {
  const trips = S.trips.filter(t => t.sauda === o.id);
  return '<tr class="click" data-go="#/sauda/' + o.id + '"><td style="font-weight:600">' + o.id + '<div class="faint">' + (o.kind === "purchase" ? "Purchase" : o.kind === "sale" ? "Sale" : "Export") + " · " + o.product + '</div></td><td class="r mono">' + num(o.qty, 0) + " t</td><td class=\"r mono\">" + (o.rate ? M("₹" + num(o.rate, 0) + "/t") : "—") + '</td><td class="r mono">' + trips.length + '</td><td class="r"><span class="pill ' + o.sc + '">' + o.status + "</span></td></tr>";
}
function partyOrderTable(list) {
  return list.length ? '<table class="tbl"><thead><tr><th>Order</th><th class="r">Qty</th><th class="r">Rate</th><th class="r">Trips</th><th class="r">Status</th></tr></thead><tbody>' + list.map(partyOrderRow).join("") + "</tbody></table>" : '<p class="muted">None.</p>';
}
function partyLedger(pid) {
  const p = PARTY[pid];
  const invs = S.invoices.filter(i => { const s = sauda(i.sauda); return s && s.party === pid; });
  let extra = "";
  if (p.type === "Mine") {
    const a = S.adv.find(x => x.m === pid);
    if (a) extra = '<div class="stats"><div class="stat"><span class="k">Advance outstanding</span><span class="v">' + M(inr(a.v)) + '</span></div><div class="stat"><span class="k">Schedule</span><span class="v" style="color:' + (a.behind ? "var(--bad)" : "var(--good)") + '">' + (a.behind ? "Behind" : "On schedule") + "</span></div></div>" + (a.note ? '<p class="faint">' + a.note + "</p>" : "");
  } else if (p.type === "DRI plant" || p.type === "Pellet plant") {
    const r = S.recv.find(x => x.p === pid);
    if (r) extra = '<div class="stats"><div class="stat"><span class="k">Not yet due</span><span class="v">' + M(inr(r.a)) + '</span></div><div class="stat"><span class="k">0–30 days overdue</span><span class="v" style="color:var(--warn)">' + M(inr(r.b)) + '</span></div><div class="stat"><span class="k">30+ days overdue</span><span class="v" style="color:var(--bad)">' + M(inr(r.c)) + "</span></div></div>";
  } else if (p.type === "Transporter") {
    const f = S.freight.find(x => x.t === pid);
    if (f) extra = '<div class="stats"><div class="stat"><span class="k">Freight paid</span><span class="v">' + M(inr(f.v)) + '</span></div><div class="stat"><span class="k">Trips billed</span><span class="v">' + f.trips + "</span></div></div>";
  }
  return extra + '<div class="scroll" style="margin-top:10px">' + (invs.length ? invoiceTable(invs) : '<p class="muted">No invoices against this party yet.</p>') + "</div>";
}
function partyOverview(pid) {
  const p = PARTY[pid];
  const orders = partyOrders(pid), trips = partyTrips(pid);
  const totalQty = orders.reduce((a, o) => a + o.qty, 0);
  const totalVal = orders.reduce((a, o) => a + o.qty * (o.rate || 0), 0);
  const avgRate = totalQty ? totalVal / totalQty : 0;
  const openN = orders.filter(o => !isClosedOrder(o)).length;
  const stats = [["Orders", orders.length], ["Open", openN], ["Closed", orders.length - openN]];
  if (totalQty) stats.push(["Total tonnage", num(totalQty, 0) + " t"]);
  if (avgRate) stats.push(["Avg rate", M("₹" + num(avgRate, 0) + "/t")]);
  if (totalVal) stats.push(["Total value", M(inr(totalVal))]);
  if (trips.length) stats.push(["Trips", trips.length]);
  if (p.type === "Mine") stats.push(["Lease valid till", p.lease], ["EC valid till", p.ec], ["GST", p.gst]);
  return '<div class="stats">' + stats.map(([k, v]) => '<div class="stat"><span class="k">' + k + '</span><span class="v">' + v + "</span></div>").join("") + "</div>";
}
function vPartyList() {
  const body = PARTY_TYPES.map(([type, label]) => {
    const ids = Object.keys(PARTY).filter(k => PARTY[k].type === type);
    if (!ids.length) return "";
    const rows = ids.map(pid => {
      const p = PARTY[pid], isTr = type === "Transporter";
      const n = isTr ? partyTrips(pid).length : partyOrders(pid).length;
      const openN = isTr ? partyTrips(pid).filter(t => t.status !== "settled" && t.status !== "received").length : partyOrders(pid).filter(o => !isClosedOrder(o)).length;
      return '<tr class="click" data-go="#/party/' + pid + '"><td style="font-weight:600">' + p.name + (p.place ? '<div class="faint">' + p.place + "</div>" : "") + '</td><td class="r mono">' + n + '</td><td class="r mono">' + openN + "</td></tr>";
    }).join("");
    return '<section class="card"><h2>' + label + '</h2><div class="scroll"><table class="tbl"><thead><tr><th>Party</th><th class="r">' + (type === "Transporter" ? "Trips" : "Orders") + '</th><th class="r">Open</th></tr></thead><tbody>' + rows + "</tbody></table></div></section>";
  }).join("");
  return head("Parties", "Every mine, plant, buyer and transporter you deal with — running and closed orders, ledgers, and business done so far.") + body;
}
function vPartyDetail(pid) {
  const p = PARTY[pid];
  if (!p) return head("Party not found", "") + '<p class="muted">Unknown party.</p>';
  const orders = partyOrders(pid), trips = partyTrips(pid);
  const running = orders.filter(o => !isClosedOrder(o)), closed = orders.filter(isClosedOrder);
  const isTr = p.type === "Transporter";
  return '<a href="#/party" style="font-size:13px">‹ Parties</a>' +
    head(p.name, p.type + (p.place ? " · " + p.place : "")) +
    '<section class="card"><h2>Overview &amp; business done so far</h2>' + partyOverview(pid) + "</section>" +
    (isTr ?
      '<section class="card"><h2>Trips</h2><div class="scroll">' + (trips.length ? tripTable(trips) : '<p class="muted">No trips yet.</p>') + "</div></section>" :
      '<section class="card"><h2>Running orders</h2><div class="scroll">' + partyOrderTable(running) + "</div></section>" +
      (trips.length ? '<section class="card"><h2>Trips against these orders</h2><div class="scroll">' + tripTable(trips) + "</div></section>" : "") +
      '<section class="card"><h2>Closed orders</h2><div class="scroll">' + partyOrderTable(closed) + "</div></section>") +
    '<section class="card"><h2>Payments &amp; receipts ledger</h2>' + partyLedger(pid) + "</section>";
}
function vParty(id) { return id ? vPartyDetail(id) : vPartyList(); }

function vAuctions(id) {

/* sales pipeline — enquiry → quotation → negotiation → accepted, with a separate "lost" column for the ones that
   didn't convert. A dedicated Kanban board (same kcard/kcol pattern as Transit) so an enquiry can be opened and
   moved, not just counted in a bar chart. */
const PIPE_FLOW = ["open", "quoted", "negotiating", "accepted"];
const PIPE_STAGES = [["open", "Enquiry"], ["quoted", "Quotation"], ["negotiating", "Negotiation"], ["accepted", "Accepted"], ["lost", "Lost"]];
const STAGE_LABEL_PIPE = Object.fromEntries(PIPE_STAGES);
const pipeWait = p => Math.max(0, -days(p.since));
function pipeCard(p) {
  const w = pipeWait(p);
  return '<div class="kcard click" data-go="#/pipeline/' + p.id + '">' +
    '<div class="kv">' + pn(p.party) + '</div>' +
    '<div class="kr">' + p.product + " · " + num(p.qty, 0) + " t</div>" +
    (p.convertedTo ? '<div class="faint" style="color:var(--good)">→ ' + p.convertedTo + '</div>' : "") +
    '<div class="kf"><span class="pill ' + (w > 14 ? "b" : w > 7 ? "w" : "n") + '">' + w + ' d open</span>' +
    (PIPE_FLOW.includes(p.status) && p.status !== "accepted" ? '<button class="btn" style="height:28px;padding:0 10px;font-size:12px" data-act="pipenext" data-id="' + p.id + '">Move →</button>' : "") + "</div></div>";
}
function vPipeline(id) {
  const found = id && S.pipeline.find(x => x.id === id);
  if (found) return vPipelineDetail(found);
  const cols = PIPE_STAGES.map(([k, label]) => {
    const cards = S.pipeline.filter(x => x.status === k);
    return '<div class="kcol"><div class="kcol-h"><span>' + label + '</span><span class="pill n">' + cards.length + "</span></div><div class=\"kcol-b\">" + (cards.length ? cards.map(pipeCard).join("") : '<p class="muted" style="font-size:12px">Empty</p>') + "</div></div>";
  }).join("");
  return head("Sales pipeline", "Every live enquiry from first contact to a booked sale order — open a card to see terms and move it forward.") +
    mtiles([
      { k: "Open enquiries", v: S.pipeline.filter(p => p.status === "open").length, color: "var(--accent2)" },
      { k: "In negotiation", v: S.pipeline.filter(p => p.status === "quoted" || p.status === "negotiating").length, color: "var(--warn)" },
      { k: "Accepted, not yet an SO", v: S.pipeline.filter(p => p.status === "accepted" && !p.convertedTo).length, color: "var(--good)" },
      { k: "Tonnage in the pipeline", v: num(S.pipeline.reduce((a, p) => a + p.qty, 0), 0) + " t", color: "var(--accent)" }
    ]) +
    '<div class="kanban">' + cols + "</div>";
}
function vPipelineDetail(p) {
  const idx = PIPE_FLOW.indexOf(p.status);
  const stageIdx = PIPE_STAGES.findIndex(s => s[0] === p.status);
  let actions = "";
  if (p.status !== "accepted" && p.status !== "lost") actions += '<button class="btn" data-act="pipelost" data-id="' + p.id + '">Mark lost</button>';
  if (idx > -1 && p.status !== "accepted") actions += '<button class="btn p" data-act="pipenext" data-id="' + p.id + '">Move to ' + STAGE_LABEL_PIPE[PIPE_FLOW[idx + 1]] + "</button>";
  if (p.status === "accepted" && !p.convertedTo) actions += '<button class="btn p" data-act="pipeconvert" data-id="' + p.id + '">Convert to sale order</button>';
  return '<a href="#/pipeline" style="font-size:13px">‹ Sales pipeline</a>' + head(p.id + " · " + pn(p.party), p.product + " · " + num(p.qty, 0) + " t · open " + pipeWait(p) + " days", actions) +

/* ask */
const QS = ["Is mahine kis plant ne sabse zyada deduction kiya?", "Kalinga DRI ka outstanding kitna hai?", "Which transporter has the worst shortage?", "Realised vs estimated margin on S-2031?", "Mine-wise average Fe, last 3 months", "Which export bills are closest to the FEMA deadline?"];
function answer(q) {
  const s = q.toLowerCase();
  if (/deduct|katauti|kataa/.test(s)) { const d = S.dedMTD.slice().sort((a, b) => b.v - a.v); return {t: pn(d[0].p) + " has deducted the most this month — " + short(d[0].v) + " of " + short(d.reduce((a, x) => a + x.v, 0)) + " in total (" + Math.round(d[0].v / d.reduce((a, x) => a + x.v, 0) * 100) + "%). Next are " + pn(d[1].p) + " at " + short(d[1].v) + " and " + pn(d[2].p) + " at " + short(d[2].v) + ". Kalinga’s Fe deductions follow a pattern: its lab read lower than the load-point on 9 of the last 11 rakes.", src: [["Debit note check", "#/settle"], ["S-2031", "#/sauda/S-2031"]]}; }
  if (/outstanding|receiv|baki|baaki|dues/.test(s)) { const pl = S.recv.find(r => s.includes(pn(r.p).split(" ")[0].toLowerCase())) || S.recv[0]; const tot = pl.a + pl.b + pl.c; return {t: pn(pl.p) + " owes " + short(tot) + ". Of that, " + short(pl.b + pl.c) + " is older than 30 days" + (pl.c ? ", including " + short(pl.c) + " past 60 days" : "") + ".", src: [["Receivables", "#/money"]]}; }
  if (/transport|shortage|kami/.test(s)) { const t = S.shortageT[0]; return {t: pn(t.t) + " has the worst transit shortage this month at " + t.v + "%, against a company average of " + S.shortAvg + "%. " + pn(S.shortageT[1].t) + " is at " + S.shortageT[1].v + "% and " + pn(S.shortageT[2].t) + " at " + S.shortageT[2].v + "%.", src: [["Trips", "#/trips"], ["Freight", "#/money"]]}; }
  if (/margin|munafa/.test(s)) { const sd = sauda((s.match(/s-\d{4}/) || ["s-2031"])[0].toUpperCase()) || sauda("S-2031"); if (!canMoney()) return {t: "Margins are hidden for your role.", src: []}; return {t: sd.id + " (" + pn(sd.party) + ") was estimated at ₹" + estMargin(sd) + "/t and is realising ₹" + sd.real + "/t so far — ₹" + Math.abs(estMargin(sd) - sd.real) + "/t " + (sd.real < estMargin(sd) ? "below" : "above") + " plan. " + (sd.real < estMargin(sd) ? "Most of the gap is assay deductions." : ""), src: [[sd.id, "#/sauda/" + sd.id]]}; }
  if (/fe|grade|mine/.test(s)) { return {t: "Average Fe over the last 3 months: " + Object.keys(S.grades).map(m => pn(m) + " " + S.grades[m].fe + "% (" + S.grades[m].n + " trips)").join(", ") + ".", src: [["Trips", "#/trips"]]}; }
  if (/fema|realis|export bill|deadline/.test(s)) { const b = S.sbs.filter(x => x.usd)[0]; return {t: b.no + " (" + b.ship + ", " + fdate(b.date) + ") has " + usd(b.usd) + " pending. Its 15-month deadline is " + fdate(addMonths(b.date, 15)) + " — " + days(addMonths(b.date, 15)) + " days away. No other bill has money pending.", src: [["Realisation", "#/export/realise"]]}; }
  return {t: "In this prototype I can answer questions on deductions, outstanding dues, transit shortage, margins, mine grades and export deadlines. In the full build, Ask works across every record.", src: []};
}

  squareoff: d => {
    const r = sauda(d.id);
    if (!r) return;
    const cat = posCategory(item(r.item));
    const isBuy = r.kind === "purchase";
    const opposite = (isBuy ? SOs() : POs()).filter(o => posCategory(item(o.item)) === cat && unmatchedQty(o) > 0);
    if (!opposite.length) { toast("No open " + (isBuy ? "sale" : "purchase") + " orders in " + cat + " to square off against"); return; }
    opposite.sort((a, b) => isBuy ? b.rate - a.rate : a.rate - b.rate);
    const other = opposite[0];
    const qty = Math.min(unmatchedQty(r), unmatchedQty(other));
    if (qty <= 0) { toast("Nothing left to square off"); return; }
    r.matches = orderMatches(r).concat([{id: other.id, qty}]);
    other.matches = orderMatches(other).concat([{id: r.id, qty}]);
    const margin = isBuy ? other.rate - r.rate : r.rate - other.rate;
    render();
    toast("Squared off " + num(qty, 0) + " t between " + r.id + " and " + other.id + " — margin ₹" + num(margin, 0) + "/t");

  booksale: ds => { const id = "S-" + (2035 + S.saudas.filter(s => s.isNew).length); S.saudas.unshift({id, kind: "sale", party: ds.p, product: "CLO 10–30 mm", qty: 4500, rate: +ds.r, sched: "CLO", matches: [{id: "P-118", qty: 4500}], disp: 0, recv: 0, setl: 0, est: {purchase: 4850, freight: ds.p === "P4" ? 470 : ds.p === "P3" ? 540 : 520, ded: 50, fin: 20}, real: 0, status: "Confirmed", sc: "g", from: "2026-09-19", to: "2026-10-20", weight: "Plant weighbridge", assay: "Plant lab", isNew: true}); const p = sauda("P-118"); p.matches = p.matches || []; p.matches.push({id, qty: 4500}); p.status = "Loading"; p.sc = "g"; done("d1"); closeModal(); render(); toast("Sale sauda " + id + " booked with " + pn(ds.p) + " and matched to P-118"); },

  copyext: () => { const t = document.getElementById("ext"); try { navigator.clipboard.writeText(t.value); } catch (e) {} done("d3"); closeModal(); render(); toast("Email copied — decision marked done"); },

  labsauda: ds => { const s = sauda(ds.id); S.lab.sched = s.sched; S.lab.rate = s.rate; S.ui.settleTab = "check"; },
  wasauda: () => modal('<h3>New sauda from WhatsApp</h3><label class="faint" for="wa">Paste the message</label><textarea id="wa" class="inp" rows="4">Kalinga DRI ko 5000 MT CLO 10-30 @5050 delivered Jajpur, Fe 63 basis, MMTC terms, Oct delivery</textarea><div id="waout"></div><div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" data-act="x">Cancel</button><button class="btn p" data-act="waparse">Draft sauda</button></div>'),
  waparse: () => { const t = document.getElementById("wa").value; const q = (t.match(/(\d[\d,]*)\s*(mt|t|ton)/i) || [])[1]; const r = (t.match(/@\s*(\d[\d,]*)/) || [])[1]; const pl = Object.keys(PARTY).filter(k => k[0] === "P").find(k => t.toLowerCase().includes(PARTY[k].name.split(" ")[0].toLowerCase())); const prod = /fines/i.test(t) ? "Fines 62%" : /5-18|5–18/.test(t) ? "CLO 5–18 mm" : "CLO 10–30 mm"; S.wa = {q: q ? +q.replace(/,/g, "") : null, r: r ? +r.replace(/,/g, "") : null, pl, prod, sched: /fines/i.test(t) ? "FINES" : "CLO"};
    document.getElementById("waout").innerHTML = '<div class="pcard"><div class="xf"><span>Party: ' + (pl ? pn(pl) : '<span style="color:var(--bad)">not found — pick one</span>') + '</span><span class="conf">' + (pl ? "97%" : "") + "</span><span>Product: " + prod + '</span><span class="conf">94%</span><span>Quantity: ' + (S.wa.q ? num(S.wa.q, 0) + " t" : "—") + '</span><span class="conf">99%</span><span>Base rate: ' + (S.wa.r ? "₹" + num(S.wa.r, 0) + "/t delivered" : "—") + '</span><span class="conf">96%</span><span>Terms: ' + SCHED[S.wa.sched].name + '</span><span class="conf lo">82%</span></div></div>' + (pl && S.wa.q && S.wa.r ? '<button class="btn p" data-act="waconfirm">Save as draft sauda</button>' : ""); },
  waconfirm: () => { const w = S.wa; const id = nextOrderId("sale"); const matchItem = S.items.find(i => itemProduct(i) === w.prod); S.saudas.unshift({id, kind: "sale", party: w.pl, product: w.prod, item: matchItem ? matchItem.id : null, qty: w.q, rate: w.r, sched: w.sched, matches: [], disp: 0, recv: 0, setl: 0, est: {purchase: 0, freight: 0, ded: 0, fin: 0}, real: 0, status: "Draft · needs purchase", sc: "w", from: "2026-10-01", to: "2026-10-31", weight: "Plant weighbridge", assay: "Third party at unloading", isNew: true}); closeModal(); go("#/sale/" + id); toast("Draft sale order " + id + " saved — match it to a purchase to confirm"); },
  uploaddoc: ds => { const d = S.docs.find(x => x.id === ds.id); d.st = "scanning"; render(); setTimeout(() => { if (d.id === "coo") { d.st = "disc"; d.issue = "Goods described as “Iron ore fines 56% Fe”; LC requires “Indian iron ore fines, Fe 56.5% basis”."; } else { d.st = "ok"; } render(); toast(d.st === "ok" ? d.name + " matches LC terms" : "Discrepancy found in " + d.name); }, 900); },
  fixdoc: ds => { const d = S.docs.find(x => x.id === ds.id); d.st = "ok"; d.issue = null; render(); toast(d.name + " marked corrected"); },
  remind: ds => { const r = S.recv.find(x => x.p === ds.id); toast("WhatsApp reminder sent to " + pn(ds.id) + " for " + short(r.b + r.c) + " overdue"); },
  fsend: ds => { const f = S.filings.find(x => x.id === ds.id); f.st = "with_ca"; render(); toast(f.n + " sent to CA"); },
  fapprove: ds => { const f = S.filings.find(x => x.id === ds.id); f.st = "approved"; f.note = "Approved by CA on 18 Sep"; render(); toast(f.n + " approved"); },
  freturn: ds => { const f = S.filings.find(x => x.id === ds.id); f.st = "returned"; f.note = "CA: fix the 2 GSTR-2B mismatches and resend"; render(); toast(f.n + " returned with comment"); },
  ffile: ds => { const f = S.filings.find(x => x.id === ds.id); f.st = "filed"; f.note = "Filed 18 Sep · acknowledgement saved"; render(); toast(f.n + " filed"); },
  askq: ds => ask(ds.q),
  impstart: () => { S.ui.importStep = 1; render(); setTimeout(() => { S.ui.importStep = 2; render(); }, 1000); },

  tretry: ds => { S.tally[+ds.i].s = "ok"; S.tally[+ds.i].why = null; render(); toast("Ledger created in Tally and journal posted"); },
  persona: ds => { S.ui.fieldP = ds.p; if (location.hash !== "#/field") go("#/field"); else render(); },
  ntscan: ds => { S.nt.scanning = true; render(); setTimeout(() => { S.nt.scanning = false; if (ds.w === "tp") { S.nt.tp = {no: "OD/TP/26/0918/" + (77580 + S.trips.length), mine: "M1", q: 30, valid: "19 Sep, 18:00"}; S.nt.step = 1; } else { S.nt.wb = {veh: "OD09 BK " + (2200 + S.trips.length), g: 42.36, t: 14.12}; S.nt.step = 2; } render(); }, 1100); },
  ntnext: () => { S.nt.step = 3; render(); },
  ntdispatch: () => { const n = S.nt; const id = "T-0918-" + String(70 + newTrips().length).padStart(3, "0"); S.trips.unshift({id, veh: n.wb.veh, sauda: n.sauda, mine: n.tp.mine, plant: sauda(n.sauda).party, tr: n.tr, tp: n.tp.no, ewb: "3410 2281 " + (4570 + S.trips.length), mineNet: r4(n.wb.g - n.wb.t), loaded: "18 Sep, 10:42", status: "in_transit", hrs: 0.1, isNew: true}); S.nt = {step: 0, scanning: false, tp: null, wb: null, sauda: n.sauda, tr: n.tr}; render(); toast("Truck dispatched — trip " + id + " is live on the dashboard"); },
  prpick: ds => { S.pr = {trip: ds.id, net: "", a: {}}; render(); },
  prback: () => { S.pr = {trip: null, net: "", a: {}}; render(); },
  prsave: () => { const pr = S.pr; const t = S.trips.find(x => x.id === pr.trip); if (!(+pr.net)) { toast("Enter the plant net weight first"); return; } t.plantNet = +pr.net; const a = {}; Object.keys(pr.a).forEach(k => { if (pr.a[k] !== "" && pr.a[k] != null) a[k] = +pr.a[k]; }); if (Object.keys(a).length) t.a = a; t.status = "received"; S.pr = {trip: null, net: "", a: {}}; render(); toast("Truck " + t.veh + " received — settlement calculated"); },
  drv: ds => { S.drv[ds.k] = true; render(); },
  /* i3MS has no public pull-API yet (confirmed — only push integrations exist for weighbridge-to-permit), so the
     realistic near-term "automate the dispatch pull" is a structured paste against the portal's own Reports →
     Permit Wise Report columns, not a live sync. This mirrors the Import & Tally pattern already in the app. */
  impi3ms: ds => {

      '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px"><button class="btn" data-act="x">Cancel</button><button class="btn p" data-act="impi3msdo" data-id="' + p.id + '">Import rows</button></div>');

  impi3msdo: ds => {

    const pm = permitsFor(p.id).find(x => !permitBlocker(x)) || permitsFor(p.id)[0];

};
function ask(q) { q = String(q || "").trim(); if (!q) return; S.chat.push({u: q}); S.chat.push({a: answer(q)}); if (location.hash !== "#/ask") go("#/ask"); else render(); }

/* ---------- events ---------- */
document.addEventListener("click", e => {
  const a = e.target.closest("[data-act]");
  if (a) {
    if (a.dataset.act === "close" && e.target.closest("[data-stop]")) return;
    const fn = ACT[a.dataset.act];
    if (fn) { if (a.tagName === "BUTTON" || a.getAttribute("href") === null) e.preventDefault(); fn(a.dataset, a, e); }
    return;
  }
  const g = e.target.closest("[data-go]");
  if (g && !e.target.closest("a")) go(g.dataset.go);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && document.querySelector(".ovl")) closeModal();
  const g = e.target.closest && e.target.closest("[data-go]");
  if (g && e.key === "Enter") go(g.dataset.go);
});
document.addEventListener("change", e => {
  const c = e.target.dataset && e.target.dataset.change; if (!c) return;
  if (c === "role") { S.role = e.target.value; S.ui.fieldP = null; S.currentUser = roleUser(S.role); go("#/" + ROLES[S.role].nav[0]); toast("Viewing as " + ROLES[S.role].name); }
  if (c === "labsched") { S.lab.sched = e.target.value; S.lab.a = {}; SCHED[S.lab.sched].lines.forEach(l => S.lab.a[l.k] = l.basis); render(); }
  if (c === "ntsauda") S.nt.sauda = e.target.value;
  if (c === "nttr") S.nt.tr = e.target.value;
});
document.addEventListener("input", e => {
  const d = e.target.dataset || {};
  if (d.lab) { if (d.lab === "qty" || d.lab === "rate") S.lab[d.lab] = e.target.value; else S.lab.a[d.lab] = e.target.value; const el = document.getElementById("labres"); if (el) el.innerHTML = labResult(); }
  if (d.pr) { if (d.pr === "net") S.pr.net = e.target.value; else S.pr.a[d.pr] = e.target.value; const el = document.getElementById("prres"); if (el) el.innerHTML = prResult(); }
  if (d.mtm) {
    const cat = d.mtm, v = parseFloat(e.target.value);
    if (!isNaN(v)) {
      S.mtm[cat].today = v;
      const row = positionRows().find(r => r.cat === cat);
      if (row) {
        const slug = catSlug(cat);
        const pl = document.getElementById("mtmpl-" + slug), dl = document.getElementById("mtmdelta-" + slug);
        if (pl) { pl.style.color = plColor(row.todaysPL || 0); pl.childNodes[0].textContent = row.todaysPL != null ? (canMoney() ? inr(row.todaysPL) : "hidden for role") : "—"; }
        if (dl) dl.textContent = (row.deltaPL >= 0 ? "+" : "") + (canMoney() ? inr(row.deltaPL) : "hidden for role") + " since yesterday";
      }
    }
  }
});
document.addEventListener("submit", e => { if (e.target.dataset.submit === "ask") { e.preventDefault(); const i = e.target.querySelector("input"); ask(i.value); } });
window.addEventListener("hashchange", render);

/* make clickable table rows keyboard reachable */
new MutationObserver(() => document.querySelectorAll("tr[data-go]:not([tabindex])").forEach(r => r.setAttribute("tabindex", "0"))).observe(document.getElementById("app"), {childList: true, subtree: true});

loadState();
(function initBases(){ const l = todayTrips(); S.dispBase = {t: 2640 - l.reduce((a, t) => a + t.mineNet, 0), n: 94 - l.length}; const it = S.trips.filter(t => t.status === "in_transit"); S.transitBase = {t: 1180 - it.reduce((a, t) => a + t.mineNet, 0), n: 41 - it.length}; })();
buildDecisions();
render();
})();
